<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户管理</title><style>
:root{--color-brand:#e83e8c;--color-brand-hover:#cf2c78;--color-brand-soft:rgba(232,62,140,.14);--color-bg:#f6f7f9;--color-surface:#ffffff;--color-surface-2:#eef1f4;--color-text:#161a22;--color-muted:#667085;--color-border:#dfe3e8;--color-success:#198754;--color-danger:#c93756;--math:#2563eb;--physics:#7c3aed;--chemistry:#047857;--biology:#b45309;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--control-min:44px;--font-mono:Consolas,"Cascadia Mono",monospace;color-scheme:light}
body.dark{--color-brand:#f472b6;--color-brand-hover:#ec4899;--color-brand-soft:rgba(244,114,182,.16);--color-bg:#11151d;--color-surface:#181e28;--color-surface-2:#222a36;--color-text:#f8fafc;--color-muted:#aab4c4;--color-border:#303947;--color-success:#55c58a;--color-danger:#fb7185;--math:#93c5fd;--physics:#c4b5fd;--chemistry:#6ee7b7;--biology:#fcd34d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html[data-viewport]{min-height:100%}
body{margin:0;min-width:280px;min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;font-size:15px;letter-spacing:0}
.skip{position:fixed;left:12px;top:-80px;z-index:100;background:var(--color-brand);color:#fff;padding:12px 16px;border-radius:var(--radius-md);text-decoration:none;transition:top 150ms}
.skip:focus{top:12px}
.app{min-height:100vh;display:block}
.dock{position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;border:1px solid var(--color-border);border-radius:18px;background:color-mix(in srgb,var(--color-surface) 90%,transparent);backdrop-filter:blur(20px) saturate(135%);box-shadow:0 18px 50px rgba(0,0,0,.10)}
.dock-brand{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid color-mix(in srgb,var(--color-brand) 30%,transparent);background:linear-gradient(145deg,var(--color-brand-soft),transparent);color:var(--color-brand);font-family:var(--font-mono);font-size:20px;font-weight:700;text-decoration:none}
.dock-nav{display:flex;flex-direction:column;gap:8px;margin-top:6px}

.nav-btn:hover,.nav-btn:focus-visible{color:var(--color-text);background:var(--color-surface-2);outline:none}

.dock-foot{margin-top:6px}

.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}
.icon-btn:hover,.icon-btn:focus-visible{border-color:var(--color-brand);color:var(--color-brand);outline:none}
.main{min-width:0;max-width:1480px;margin:0 auto;padding:0 32px 64px 104px}
.appbar{position:sticky;top:0;z-index:20;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 8px;background:color-mix(in srgb,var(--color-bg) 86%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--color-border)}
.appbar h1{font-size:18px;margin:0;font-weight:700}
.appbar-actions{display:flex;gap:8px}
.view{padding-top:28px}
.view[hidden]{display:none}
.panel{border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--radius-lg)}
.muted{color:var(--color-muted);font-size:.86rem}

.hero{position:relative;padding:40px;overflow:hidden;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:linear-gradient(125deg,var(--color-surface) 0%,var(--color-surface-2) 55%,var(--color-surface) 100%)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 18%,var(--color-brand-soft),transparent 35%);pointer-events:none}
.hero-copy{position:relative;z-index:2}
.kicker{color:var(--color-brand);font-weight:700;font-size:.82rem;letter-spacing:.02em}
.hero-title{font-size:clamp(28px,3.5vw,40px);line-height:1.2;margin:14px 0 10px;overflow-wrap:anywhere;font-weight:700}

.live-dot{width:8px;height:8px;border-radius:50%;background:var(--color-brand);box-shadow:0 0 0 5px var(--color-brand-soft);flex:0 0 auto}
.pill{border:1px solid var(--color-border);padding:4px 10px;border-radius:999px;font-size:.8rem;background:var(--color-surface)}
.hero-sub{margin:0 0 18px;color:var(--color-muted);font-size:15px;line-height:1.6;max-width:560px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.recall{display:inline-flex;gap:8px;align-items:center;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:transparent;color:var(--color-muted);font-size:13px;cursor:pointer;min-height:44px}
.recall:hover{color:var(--color-text);border-color:var(--color-brand)}

.poster{flex:0 0 78%;min-width:0;padding:16px 18px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface)}
.poster.active{border-color:var(--color-brand);background:linear-gradient(120deg,var(--color-brand-soft),var(--color-surface))}
.poster-index{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--color-surface-2);font-family:var(--font-mono);font-size:14px;color:var(--color-muted)}
.poster.active .poster-index{background:var(--color-brand);color:#fff}

.poster-copy{min-width:0}
.poster-copy strong{display:block;font-size:14px}

.poster time{font-family:var(--font-mono);font-size:11px;color:var(--color-muted);white-space:nowrap}

.part-item{padding:16px 0;border-bottom:1px solid var(--color-border)}

.timecode{font-family:var(--font-mono);color:var(--color-muted);font-size:.82rem}
.part-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.part-actions input{min-height:44px;width:130px;border:1px solid var(--color-border);background:var(--color-surface-2);border-radius:var(--radius-md);padding:0 10px;font-family:var(--font-mono)}
.error{color:var(--color-danger);min-height:20px;font-size:.82rem}
.day-rail{padding:20px}
.day-rail h2,.section-head h2{font-size:18px;margin:0 0 14px}
.day-track{position:relative}
.day-track:before{content:"";position:absolute;left:59px;top:20px;bottom:20px;width:2px;background:var(--color-border)}
.rail-item{display:grid;grid-template-columns:44px 16px minmax(0,1fr) auto;gap:8px;padding:11px 0;align-items:center;position:relative}
.rail-item time{font-family:var(--font-mono);font-size:12px;color:var(--color-muted)}
.rail-node{width:12px;height:12px;border-radius:50%;border:2px solid var(--color-border);background:var(--color-surface);z-index:2;justify-self:center}
.rail-item.done .rail-node{background:var(--color-success);border-color:var(--color-success)}
.rail-item.current .rail-node{background:var(--color-brand);border-color:var(--color-brand)}
.rail-item button{color:inherit;text-align:left;border:0;background:transparent;cursor:pointer;min-width:0}
.rail-item button b{display:block;font-size:13px}
.rail-item button p{margin:2px 0 0;color:var(--color-muted);font-size:12px}
.rail-item.current button b,.rail-item.current small{color:var(--color-brand)}
.rail-item small{justify-self:end;font-size:11px;color:var(--color-muted);white-space:nowrap}
.evening{margin-top:20px;padding-top:16px;border-top:1px solid var(--color-border)}
.evening h2{font-size:16px;margin:0 0 10px}
.task-check{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;cursor:pointer}

.check-ui{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-border);border-radius:var(--radius-sm);color:transparent;background:var(--color-surface)}
.check-ui svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.task-check input:checked+.check-ui{background:var(--color-brand);border-color:var(--color-brand);color:#fff}
.task-check input:focus-visible+.check-ui{outline:2px solid var(--color-brand);outline-offset:2px}
.task-copy strong{display:block;font-size:13px}
.task-copy small{display:block;font-size:12px;color:var(--color-muted);margin-top:2px}
.section-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px;flex-wrap:wrap}
.date-strip{display:flex;gap:8px;overflow:auto;padding-bottom:10px}
.chip[aria-current=date],.chip[aria-current=page]{background:var(--color-brand);border-color:var(--color-brand);color:#fff}
.schedule-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.62fr);gap:24px}
.timeline{padding:8px 24px}
.timeline-row{display:grid;grid-template-columns:96px 16px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--color-border);align-items:start}
.timeline-dot{width:12px;height:12px;border-radius:50%;background:var(--color-muted);margin-top:5px;justify-self:center}
.timeline-row.active .timeline-dot{background:var(--color-brand);outline:4px solid var(--color-brand-soft)}
.phase-title{margin:14px 0 4px;font-size:.86rem;color:var(--color-muted);font-weight:600;list-style:none}
.row-btn{display:block;text-align:left;border:0;background:transparent;cursor:pointer;color:inherit;min-height:44px}
.detail-panel{padding:22px;align-self:start;position:sticky;top:92px}
.route-tabs{display:flex;gap:8px;margin-bottom:16px}
.route-table,.records-table{width:100%;border-collapse:collapse;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--color-border);vertical-align:top}
th{font-size:.8rem;color:var(--color-muted)}
.topic-row td{background:var(--color-surface-2);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter,select{min-height:44px;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--radius-md);padding:0 10px}
.empty{padding:42px;text-align:center;color:var(--color-muted)}
.status-live{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--color-brand) 45%,transparent);outline-offset:2px}
.subject-数学{color:var(--math)}
.subject-物理{color:var(--physics)}
.subject-化学{color:var(--chemistry)}
.subject-生物{color:var(--biology)}
.mobile-nav{display:none}
.storage-status{padding:12px 16px;margin-bottom:14px}
.moment-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;margin-bottom:18px;border:1px solid var(--color-border);border-left:4px solid var(--color-brand);border-radius:var(--radius-md);background:var(--color-surface)}
.moment-bar[data-moment-kind="current"]{border-left-color:var(--color-success)}
.moment-bar[data-moment-kind="break"]{border-left-color:var(--biology)}
.moment-bar[data-moment-kind="upcoming"]{border-left-color:var(--color-brand)}
.moment-clock{font-family:var(--font-mono);font-weight:700;white-space:nowrap}
.moment-copy{min-width:0}.moment-copy strong,.moment-copy span{display:block;overflow-wrap:anywhere}.moment-copy span{margin-top:3px;color:var(--color-muted);font-size:.84rem}
.reminder-settings{margin-top:18px;padding:18px}.reminder-settings summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;padding-top:12px}.setting{display:grid;gap:7px}.setting label{font-size:.86rem;font-weight:600}.setting-checks{display:flex;gap:16px;flex-wrap:wrap}.setting-checks label{display:flex;align-items:center;gap:7px;min-height:44px}.setting-actions{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}.reminder-note{grid-column:1/-1;margin:0;color:var(--color-muted);font-size:.82rem;line-height:1.55}.reminder-status{grid-column:1/-1;min-height:20px;color:var(--color-muted);font-size:.82rem}
.timeline-row[data-moment-kind="current"],.timeline-row[data-moment-kind="break"],.timeline-row[data-moment-kind="upcoming"],.timeline-row[data-moment-kind="evening"]{background:var(--color-brand-soft)}
.timeline-row[data-moment-kind="break"] .timeline-dot{background:var(--biology)}
.timeline-row[data-moment-kind="upcoming"] .timeline-dot,.timeline-row[data-moment-kind="evening"] .timeline-dot{background:var(--color-brand);outline:4px solid var(--color-brand-soft)}
.mobile-detail{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none}
.mobile-detail::backdrop{background:rgba(0,0,0,.55)}
.mobile-detail>div{background:var(--color-surface);padding:22px;max-width:520px;margin:auto;border-radius:var(--radius-lg)}
@media (min-width: 761px){.mobile-context{display:none}}
@media (max-width: 760px){
html,body{max-width:100%;overflow-x:hidden}
.app{display:block}
.dock{display:none}
.main{padding:0 12px calc(96px + env(safe-area-inset-bottom))}
.appbar{min-height:60px;padding:0 4px}
.appbar-actions .btn{padding:0 10px}
.view{padding-top:16px}
.execute-grid,.schedule-grid{grid-template-columns:1fr}
.hero{padding:24px 16px}
.hero-title{font-size:26px}
.part-head{display:block}
.timecode{margin-top:6px;overflow-wrap:anywhere}
.part-actions{display:grid;grid-template-columns:1fr 1fr}
.part-actions input{width:100%;grid-column:1/-1}
.day-rail{padding:16px}
.detail-panel{position:static}
.moment-bar{grid-template-columns:1fr}.moment-bar .btn{width:100%}.settings-grid{grid-template-columns:1fr}.setting-actions{grid-column:1}.reminder-note,.reminder-status{grid-column:1}
.section-head{display:block}
.route-table,.records-table{display:block;overflow-x:auto;white-space:nowrap}
.mobile-nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;width:min(calc(100% - 24px),420px);min-height:64px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--color-border);border-radius:18px;background:color-mix(in srgb,var(--color-surface) 92%,transparent);backdrop-filter:blur(20px) saturate(135%);box-shadow:0 16px 40px rgba(0,0,0,.14)}
.mobile-nav .nav-btn{width:auto;height:52px;min-height:52px;border-radius:14px}
.mobile-nav .nav-btn[aria-current=page]{background:var(--color-brand);color:#fff}
}
@media (max-width:360px){.appbar-actions .btn span{position:absolute;width:1px;height:1px;overflow:hidden}.actions .btn{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><main class="main"><section id="notFound" class="panel"><h1>未找到页面</h1></section><section id="adminApp" class="panel" hidden><h1>账户管理</h1><label>精确邮箱<input id="adminEmail" type="email"></label><button class="btn primary" onclick="adminFind()">查询</button><p id="adminResult"></p><div class="actions"><button class="btn" onclick="adminAction('disable')">禁用</button><button class="btn" onclick="adminAction('enable')">启用</button><button class="btn" onclick="adminAction('revoke-sessions')">吊销会话</button><button class="btn" onclick="adminAction('temporary-password')">生成临时密码</button></div><pre id="temporaryPassword"></pre><h2>审计记录</h2><pre id="auditEntries"></pre></section></main><script>const adminState={user:null,csrfToken:null,target:null};
async function adminApi(path,options={}){const headers=new Headers(options.headers||{});if(options.body!==undefined)headers.set('Content-Type','application/json');if(adminState.csrfToken&&options.method==='POST')headers.set('X-CSRF-Token',adminState.csrfToken);const response=await fetch(path,{...options,headers,credentials:'include',body:options.body===undefined?undefined:JSON.stringify(options.body)}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error?.message||'未找到页面');return data}
async function adminBoot(){try{const data=await adminApi('/api/auth/session',{method:'GET'});if(data.user.role!=='admin')throw new Error();adminState.user=data.user;document.body.dataset.authorized='true';document.querySelector('#adminApp').hidden=false;document.querySelector('#notFound').hidden=true;await loadAudit()}catch(_){document.querySelector('#adminApp').hidden=true;document.querySelector('#notFound').hidden=false}}
async function adminFind(){try{const data=await adminApi(`/api/admin/users?email=${encodeURIComponent(document.querySelector('#adminEmail').value)}`,{method:'GET'});adminState.target=data.user;document.querySelector('#adminResult').textContent=`${data.user.email} · ${data.user.role} · ${data.user.status}`}catch(error){document.querySelector('#adminResult').textContent=error.message}}
async function adminAction(action){if(!adminState.target)return;const data=await adminApi(`/api/admin/users/${encodeURIComponent(adminState.target.id)}/${action}`,{method:'POST',body:{}});document.querySelector('#temporaryPassword').textContent=data.temporaryPassword||'操作完成';await adminFind();await loadAudit()}
async function loadAudit(){const data=await adminApi('/api/admin/audit',{method:'GET'});document.querySelector('#auditEntries').textContent=data.entries.map(entry=>`${new Date(entry.createdAt).toLocaleString()} · ${entry.action} · ${entry.result}`).join('\n')}

document.addEventListener('DOMContentLoaded',adminBoot)</script></body></html>
