function routesHTML(){const route=APP.routes.find(r=>r.subject===state.routeSubject);if(route.subject==='生物')return `<div class="section-head"><div><h2>生物晚间复习路线</h2><span class="muted">仅投影冻结晚间任务，不包含生物视频课程。</span></div></div>${route.topics[0].tasks.map(x=>`<div class="panel storage-status">${x.date} · ${esc(x.task.text)} · ${state.evening[x.task.key]?'已完成':'未完成'}</div>`).join('')}`;const done=route.courses.filter(blockDone).length,partial=route.courses.filter(blockPartial).length;return `<div class="section-head"><div><h2>全计划路线</h2><span class="muted">冻结课表投影 · 总数 ${route.courses.length} · 完成 ${done} · 部分 ${partial} · 剩余 ${route.courses.length-done}</span></div></div><div class="route-tabs">${APP.routes.map(r=>`<button class="chip" data-subject="${r.subject}" ${r.subject===state.routeSubject?'aria-current="page"':''}>${r.subject}</button>`).join('')}</div><table class="route-table"><thead><tr><th>主题</th><th>课程数</th><th>当前位置</th><th>下一节点</th></tr></thead><tbody>${route.topics.map(topic=>{const next=topic.courses.find(b=>!blockDone(b));return `<tr class="topic-row"><td>${esc(topic.name)}</td><td>${topic.courses.length}</td><td>${topic.courses.filter(blockDone).length}/${topic.courses.length}</td><td>${next?`<button class="btn" data-block="${next.blockNo}">${esc(next.date)} · 执行</button>`:'已完成'}</td></tr>`}).join('')}</tbody></table>`}
function bindRoutes(){$$('[data-subject]').forEach(b=>b.onclick=()=>{state.routeSubject=b.dataset.subject;render()});$$('[data-block]').forEach(b=>b.onclick=()=>selectBlock(+b.dataset.block))}
function recordsHTML(){const rows=APP.courses.filter(b=>state.recordSubject==='all'||b.subject===state.recordSubject).filter(b=>state.recordDay==='all'||String(b.dayIndex)===state.recordDay).filter(b=>state.recordStatus==='all'||(state.recordStatus==='done'?blockDone(b):state.recordStatus==='partial'?blockPartial(b):!blockDone(b)&&!blockPartial(b))),storageMessage=storageIssues.length?'已有本地数据损坏，已回退到当前会话':state.storageWritable?'可读写':'不可用，进度仅保留当前会话';return `<div class="section-head"><div><h2>本机学习记录</h2><span class="muted">课程、实际停止点、晚间完成和每日可验证产出集中留档。</span></div></div><div class="panel storage-status" id="storageStatus">本机存储：${storageMessage}</div><div class="filters"><select id="statusFilter" aria-label="状态筛选"><option value="all">全部状态</option><option value="done">已完成</option><option value="partial">进行中</option><option value="todo">未开始</option></select><select id="subjectFilter" aria-label="科目筛选"><option value="all">全部科目</option><option>数学</option><option>物理</option><option>化学</option></select><select id="dayFilter" aria-label="学习日筛选"><option value="all">全部学习日</option>${APP.days.map(d=>`<option value="${d.dayIndex}">第${d.dayIndex}天</option>`).join('')}</select><button class="btn" id="resetFilters">重置筛选</button><button class="btn" id="exportData">导出</button><label class="btn">导入<input id="importData" type="file" accept="application/json" hidden></label><button class="btn danger" id="clearCourse">清除课程</button><button class="btn danger" id="clearEvening">清除晚间</button><button class="btn danger" id="clearAll">清除全部</button></div>${rows.length?`<table class="records-table"><thead><tr><th>课程</th><th>日期</th><th>状态</th><th>实际停止点</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(b.subject)} · ${esc(b.topic)}</td><td>${b.date} ${esc(b.slot)}</td><td>${statusLabel(b)}</td><td>${b.parts.map(p=>partState(b,p)?.actual).filter(Boolean).join(' / ')||'—'}</td><td><button class="btn" data-block="${b.blockNo}">查看</button></td></tr>`).join('')}</tbody></table>`:'<div class="panel empty"><p>没有符合当前筛选条件的记录。</p><button class="btn" id="emptyReset">重置筛选</button></div>'}<h2>晚间完成与产出</h2>${APP.days.map(d=>`<div class="panel storage-status">${d.date} · ${d.evening.tasks.filter(t=>state.evening[eveningKey(d,t)]).length}/${d.evening.tasks.length} · ${esc(d.evening.output)}</div>`).join('')}`}
function validImport(data){if(!data||typeof data!=='object'||Object.keys(data).sort().join(',')!=='course,evening,version'||data.version!==1||!data.course||!data.evening||Array.isArray(data.course)||Array.isArray(data.evening))return false;const parts=new Map(APP.courses.flatMap(b=>b.parts.map(p=>[partKey(b,p),p])));for(const [key,v] of Object.entries(data.course)){const p=parts.get(key),seconds=v&&parseHMS(v.actual);if(!p||Object.keys(v).sort().join(',')!=='actual,status'||!['done','partial'].includes(v.status)||seconds===null||seconds<p.start||seconds>p.duration||(v.status==='done')!==(seconds===p.duration))return false}const eveningKeys=new Set(APP.days.flatMap(d=>d.evening.tasks.map(t=>eveningKey(d,t))));return Object.entries(data.evening).every(([k,v])=>eveningKeys.has(k)&&v===true)}
function bindRecords(){const reset=()=>{state.recordStatus='all';state.recordSubject='all';state.recordDay='all';render()};$('#statusFilter').value=state.recordStatus;$('#subjectFilter').value=state.recordSubject;$('#dayFilter').value=state.recordDay;$('#statusFilter').onchange=e=>{state.recordStatus=e.target.value;render()};$('#subjectFilter').onchange=e=>{state.recordSubject=e.target.value;render()};$('#dayFilter').onchange=e=>{state.recordDay=e.target.value;render()};$('#resetFilters').onclick=reset;$('#emptyReset')?.addEventListener('click',reset);$$('[data-block]').forEach(b=>b.onclick=()=>selectBlock(+b.dataset.block));$('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,course:state.course,evening:state.evening},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='niypher-study-progress.json';a.click();URL.revokeObjectURL(a.href)};$('#importData').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!validImport(data))throw new Error();const oldCourse=state.course,oldEvening=state.evening;if(!writeJSON(COURSE_STORAGE_KEY,data.course)||!writeJSON(EVENING_STORAGE_KEY,data.evening)){writeJSON(COURSE_STORAGE_KEY,oldCourse);writeJSON(EVENING_STORAGE_KEY,oldEvening);throw new Error()}state.course=data.course;state.evening=data.evening;announce('进度导入成功');render()}catch(_){announce('导入失败：原有进度未被覆盖')}};reader.readAsText(file)};const clear=(type)=>{const text={course:'仅清除课程进度？晚间记录将保留。',evening:'仅清除晚间进度？课程记录将保留。',all:'清除全部本机学习状态？'}[type];if(!confirm(text))return;if(type!=='evening'){state.course={};persist(COURSE_STORAGE_KEY,{})}if(type!=='course'){state.evening={};persist(EVENING_STORAGE_KEY,{})}render()};$('#clearCourse').onclick=()=>clear('course');$('#clearEvening').onclick=()=>clear('evening');$('#clearAll').onclick=()=>clear('all')}
function getUtc8Hour(now=new Date()){return new Date(now.getTime()+8*60*60*1000).getUTCHours()}function getAutomaticTheme(now=new Date()){const h=getUtc8Hour(now);return h>=6&&h<18?'light':'dark'}function setTheme(theme){document.body.classList.toggle('dark',theme==='dark');try{localStorage.setItem(THEME_STORAGE_KEY,theme)}catch(_){}$('#theme').setAttribute('aria-label',theme==='dark'?'切换到浅色主题':'切换到深色主题')}
function applyViewportMode(event){document.documentElement.dataset.viewport=event.matches?'mobile':'desktop'}
function render(){renderShell();if(state.view==='execute'){$('#view-execute').innerHTML=executeHTML();bindExecute()}if(state.view==='schedule'){$('#view-schedule').innerHTML=scheduleHTML();bindSchedule()}if(state.view==='routes'){$('#view-routes').innerHTML=routesHTML();bindRoutes()}if(state.view==='records'){$('#view-records').innerHTML=recordsHTML();bindRecords()}}
document.addEventListener('DOMContentLoaded',()=>{const saved=(()=>{try{return localStorage.getItem(THEME_STORAGE_KEY)}catch(_){return null}})();setTheme(saved||getAutomaticTheme());const mq=matchMedia(VIEWPORT_BREAKPOINT);applyViewportMode(mq);mq.addEventListener?.('change',applyViewportMode);$('#theme').onclick=()=>setTheme(document.body.classList.contains('dark')?'light':'dark');bindAccountUI();state.moment=resolveScheduleMoment();if(!selectedBlock()){if(!locateScheduleMoment(state.moment,{force:true})){const focus=automaticFocus(state.moment.utc8Date);state.dayIndex=focus.dayIndex;if(focus.blockNo)state.selectedBlock=focus.blockNo}}render();hydrateStructuredStorage();loadSession();refreshScheduleMoment({reason:'initial',allowLocate:false});setInterval(()=>refreshScheduleMoment({reason:'tick'}),1000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){refreshScheduleMoment({reason:'visible'});syncNow()}});window.addEventListener('online',syncNow);window.addEventListener('focus',()=>refreshScheduleMoment({reason:'focus'}));window.addEventListener('storage',event=>{if(event.key===REMINDER_EVENT_STORAGE_KEY){state.reminderEvents=readJSON(REMINDER_EVENT_STORAGE_KEY);refreshScheduleMoment({reason:'storage',allowLocate:false})}if(event.key===REMINDER_STORAGE_KEY){state.reminders={...DEFAULT_REMINDERS,...readJSON(REMINDER_STORAGE_KEY)};render()}})});

const IDB_NAME='niypher-study-v1',IDB_VERSION=1,IDB_STORES=['records','syncQueue','metadata'];
const memoryFallback=new Map();let idbDatabase=null,storageMode='memory';
function idbRequest(request){return new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function openStudyDatabase(){if(!('indexedDB'in window))throw new Error('IDB_UNAVAILABLE');const request=indexedDB.open(IDB_NAME,IDB_VERSION);request.onupgradeneeded=()=>{const db=request.result;for(const store of IDB_STORES)if(!db.objectStoreNames.contains(store))db.createObjectStore(store,{keyPath:'id'})};idbDatabase=await idbRequest(request);storageMode='indexeddb';return idbDatabase}
async function idbPut(store,value){if(!idbDatabase)await openStudyDatabase();const transaction=idbDatabase.transaction(store,'readwrite');transaction.objectStore(store).put(value);await new Promise((resolve,reject)=>{transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error)})}
async function idbGetAll(store){if(!idbDatabase)await openStudyDatabase();return idbRequest(idbDatabase.transaction(store).objectStore(store).getAll())}
function recordNamespace(key){return key===COURSE_STORAGE_KEY?'course':key===EVENING_STORAGE_KEY?'evening':key===REMINDER_STORAGE_KEY||key===REMINDER_EVENT_STORAGE_KEY?'reminder':key===UI_STORAGE_KEY?'ui':'settings'}
function deviceId(){let value=readJSON('niypher-study-device-v1').id;if(!value){value=crypto.randomUUID?.()||`${Date.now()}-device`;writeJSON('niypher-study-device-v1',{id:value})}return value}
async function metadataVersion(namespace,recordKey){try{if(!idbDatabase)await openStudyDatabase();const value=await idbRequest(idbDatabase.transaction('metadata').objectStore('metadata').get(`${namespace}:${recordKey}`));return value?.version||0}catch(_){return 0}}
async function queueRecord(namespace,recordKey,value,deleted=false){const updatedAt=Date.now(),knownServerVersion=await metadataVersion(namespace,recordKey);await idbPut('records',{id:`${namespace}:${recordKey}`,namespace,recordKey,value,updatedAt,version:knownServerVersion,deleted});await idbPut('syncQueue',{id:`${namespace}:${recordKey}`,namespace,recordKey,value,clientUpdatedAt:updatedAt,deviceId:deviceId(),knownServerVersion,deleted})}
async function persistStructured(key,value){const namespace=recordNamespace(key);try{if(namespace==='course'||namespace==='evening'){const previous=memoryFallback.get(key)||{};const allKeys=new Set([...Object.keys(previous),...Object.keys(value)]);for(const recordKey of allKeys){const deleted=!(recordKey in value);await queueRecord(namespace,recordKey,deleted?null:value[recordKey],deleted)}}else await queueRecord(namespace,key,value,false);memoryFallback.set(key,structuredClone(value));storageMode='indexeddb'}catch(_){storageMode=writeJSON(key,value)?'localstorage':'memory';memoryFallback.set(key,value);if(storageMode==='memory')announce('本机存储不可用，请立即导出 JSON 备份')}writeJSON(key,value);state.storageMode=storageMode;scheduleSync()}
async function hydrateStructuredStorage(){try{await openStudyDatabase();const records=await idbGetAll('records'),course={},evening={};for(const record of records){if(record.namespace==='course'&&!record.deleted)course[record.recordKey]=record.value;if(record.namespace==='evening'&&!record.deleted)evening[record.recordKey]=record.value}if(Object.keys(course).length)state.course=course;if(Object.keys(evening).length)state.evening=evening;memoryFallback.set(COURSE_STORAGE_KEY,structuredClone(state.course));memoryFallback.set(EVENING_STORAGE_KEY,structuredClone(state.evening));storageMode='indexeddb'}catch(_){storageMode=state.storageWritable?'localstorage':'memory';announce('本机降级保存已启用')}state.storageMode=storageMode;render()}

function importV2(data){if(!data||typeof data!=='object'||data.version!==2||!Array.isArray(data.records))return null;const course={},evening={};for(const record of data.records){if(!record||typeof record!=='object'||typeof record.recordKey!=='string')return null;if(record.namespace==='course'&&!record.deleted)course[record.recordKey]=record.value;else if(record.namespace==='evening'&&!record.deleted&&record.value===true)evening[record.recordKey]=true}return{version:1,course,evening}}
function exportPayloadV2(){const records=[];for(const [recordKey,value]of Object.entries(state.course))records.push({namespace:'course',recordKey,value,deleted:false});for(const [recordKey,value]of Object.entries(state.evening))records.push({namespace:'evening',recordKey,value,deleted:false});return{version:2,exportedAt:Date.now(),records}}
function normalizeImportPayload(data){if(data?.version===2)return importV2(data);return validImport(data)?data:null}
document.addEventListener('click',event=>{if(event.target?.id!=='exportData')return;event.preventDefault();event.stopImmediatePropagation();const blob=new Blob([JSON.stringify(exportPayloadV2(),null,2)],{type:'application/json'}),anchor=document.createElement('a');anchor.href=URL.createObjectURL(blob);anchor.download='niypher-study-backup-v2.json';anchor.click();URL.revokeObjectURL(anchor.href)},true)
document.addEventListener('change',event=>{if(event.target?.id!=='importData')return;event.stopImmediatePropagation();const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=normalizeImportPayload(JSON.parse(reader.result));if(!data)throw new Error();state.course=data.course;state.evening=data.evening;persist(COURSE_STORAGE_KEY,state.course);persist(EVENING_STORAGE_KEY,state.evening);announce('备份导入成功');render()}catch(_){announce('导入失败：原有进度未被覆盖')}};reader.readAsText(file)},true)

const API_ORIGIN=(document.querySelector('meta[name="niypher-api-origin"]')?.content||'').replace(/\/$/,''),SYNC_BACKOFF=[1000,3000,10000,30000,120000];let syncTimer=null,syncAttempt=0;
function cloudAvailable(){return location.protocol!=='file:'&&window.isSecureContext&&Boolean(API_ORIGIN)}
async function api(path,options={}){if(!cloudAvailable())throw new Error('CLOUD_UNAVAILABLE');const headers=new Headers(options.headers||{});if(options.body!==undefined)headers.set('Content-Type','application/json');if(state.account.csrfToken&&options.method&&options.method!=='GET')headers.set('X-CSRF-Token',state.account.csrfToken);const response=await fetch(`${API_ORIGIN}${path}`,{...options,headers,credentials:'include',body:options.body===undefined?undefined:JSON.stringify(options.body)}),data=await response.json().catch(()=>({}));if(!response.ok){const problem=new Error(data.error?.message||'请求失败');problem.code=data.error?.code;problem.payload=data;throw problem}return data}
async function loadSession(){if(!cloudAvailable())return;try{const data=await api('/api/auth/session',{method:'GET'});state.account.user=data.user;state.account.status='idle'}catch(_){state.account.user=null}renderAccountStatus()}
async function syncPull(){const data=await api(`/api/sync/pull?cursor=${state.account.cursor||0}`,{method:'GET'});for(const record of data.records||[]){const target=record.namespace==='course'?state.course:record.namespace==='evening'?state.evening:null;if(target){if(record.deleted)delete target[record.recordKey];else target[record.recordKey]=record.value}await idbPut('metadata',{id:`${record.namespace}:${record.recordKey}`,version:record.version,updatedAt:record.updatedAt})}state.account.cursor=data.cursor||state.account.cursor;memoryFallback.set(COURSE_STORAGE_KEY,structuredClone(state.course));memoryFallback.set(EVENING_STORAGE_KEY,structuredClone(state.evening));writeJSON(COURSE_STORAGE_KEY,state.course);writeJSON(EVENING_STORAGE_KEY,state.evening)}
async function syncPush(){const queued=await idbGetAll('syncQueue');if(!queued.length)return;const requestId=(crypto.randomUUID?.()||`${Date.now()}_request`).replace(/-/g,'_'),batch=queued.slice(0,100),result=await api('/api/sync/push',{method:'POST',body:{requestId,records:batch.map(({id,...record})=>record)}});for(const accepted of result.accepted||[])await idbPut('metadata',{id:`${accepted.namespace}:${accepted.recordKey}`,version:accepted.version,updatedAt:Date.now()});const tx=idbDatabase.transaction('syncQueue','readwrite');for(const item of batch)tx.objectStore('syncQueue').delete(item.id);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function showSyncConflicts(conflicts){state.account.conflicts=conflicts||[];const box=$('#syncConflicts');box.hidden=!state.account.conflicts.length;box.innerHTML=state.account.conflicts.map((conflict,index)=>`<div class="panel"><strong>${conflict.namespace} · ${conflict.recordKey}</strong><div class="actions"><button class="btn" onclick="resolveSyncConflict(${index},'local')">保留本机</button><button class="btn" onclick="resolveSyncConflict(${index},'server')">采用云端</button></div></div>`).join('')}
async function resolveSyncConflict(index,choice){const conflict=state.account.conflicts[index];if(!conflict)return;if(choice==='server'){const target=conflict.namespace==='course'?state.course:conflict.namespace==='evening'?state.evening:null;if(target){if(conflict.server?.deleted)delete target[conflict.recordKey];else target[conflict.recordKey]=conflict.server?.value}await idbPut('metadata',{id:`${conflict.namespace}:${conflict.recordKey}`,version:conflict.server?.version||0,updatedAt:Date.now()})}else{const queued=(await idbGetAll('syncQueue')).find(item=>item.namespace===conflict.namespace&&item.recordKey===conflict.recordKey);if(queued){queued.knownServerVersion=conflict.server?.version||0;await idbPut('syncQueue',queued)}}state.account.conflicts.splice(index,1);showSyncConflicts(state.account.conflicts);render();if(choice==='local')syncNow()}
async function syncNow(){if(!cloudAvailable()||!state.account.user)return;if(syncTimer){clearTimeout(syncTimer);syncTimer=null}state.account.status='syncing';renderAccountStatus();try{await syncPull();await syncPush();syncAttempt=0;state.account.status='synced';state.account.lastSync=Date.now()}catch(error){state.account.status='failed';if(error.code==='SYNC_CONFLICT')showSyncConflicts(error.payload.conflicts);else{syncAttempt=Math.min(syncAttempt+1,SYNC_BACKOFF.length-1);syncTimer=setTimeout(syncNow,SYNC_BACKOFF[syncAttempt])}}renderAccountStatus()}
function scheduleSync(){if(!cloudAvailable()||!state.account.user)return;if(syncTimer)clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,250)}

async function submitAccount(mode){const email=$('#accountEmail').value,password=$('#accountPassword').value,invite=$('#accountInvite').value,path=mode==='login'?'/api/auth/login':mode==='bootstrap'?'/api/auth/bootstrap-register':'/api/auth/register';try{const data=await api(path,{method:'POST',body:{email,password,invite,remember:$('#accountRemember').checked}});state.account.user=data.user;state.account.csrfToken=data.csrfToken;$('#accountDialog').close();await syncNow()}catch(error){$('#accountError').textContent=error.message}}
async function changeAccountPassword(){try{const data=await api('/api/auth/change-password',{method:'POST',body:{newPassword:$('#accountNewPassword').value}});state.account.user=data.user;state.account.csrfToken=data.csrfToken;$('#accountError').textContent='密码已修改'}catch(error){$('#accountError').textContent=error.message}}
async function logoutAccount(all=false){try{await api(all?'/api/auth/logout-all':'/api/auth/logout',{method:'POST',body:{}})}finally{state.account.user=null;state.account.csrfToken=null;renderAccountStatus()}}

function renderAccountStatus(){const button=$('#accountButton'),status=$('#syncStatus');if(button)button.textContent=state.account.user?state.account.user.email:'账户';if(status)status.textContent=!cloudAvailable()?'云端同步仅在HTTPS版可用':state.account.user?({idle:'本机已保存',syncing:'同步中',synced:'已同步',failed:'同步失败'}[state.account.status]||'本机已保存'):'未登录'}
function openAccount(){const dialog=$('#accountDialog');$('#accountCloudNote').textContent=cloudAvailable()?'使用 @niypher.com 账户登录并同步。':'云端同步仅在HTTPS版可用';dialog.showModal()}
function bindAccountUI(){$('#accountButton').onclick=openAccount;$('#syncNow').onclick=syncNow;$('#accountClose').onclick=()=>$('#accountDialog').close();$('#accountLogin').onclick=()=>submitAccount('login');$('#accountRegister').onclick=()=>submitAccount('register');$('#accountBootstrap').onclick=()=>submitAccount('bootstrap');$('#accountChangePassword').onclick=changeAccountPassword;$('#accountLogout').onclick=()=>logoutAccount(false);$('#accountLogoutAll').onclick=()=>logoutAccount(true)}
</script></body></html>
